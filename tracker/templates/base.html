<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Equipment Checkout Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;
          padding-bottom: .75rem; border-bottom: 1px solid #ccc; }
    .nav-user { margin-left: auto; color: #555; }
    .nav-form, .nav-form button { margin: 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input, select { padding: .35rem; width: 18rem; max-width: 100%; }
    button { margin-top: 1rem; padding: .45rem 1rem; }
    .error { color: #b00020; margin: .2rem 0 0; }
    .flash { background: #e6f4ea; padding: .5rem .75rem; border-radius: 4px; }
    .actions { display: flex; gap: .75rem; align-items: center; }
    .actions form, .actions button { margin: 0; }
    tr.retired td { color: #777; }
    .badge-retired { background: #eee; color: #555; border: 1px solid #bbb;
                     padding: .1rem .45rem; border-radius: 999px; font-size: .85em; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    {% if g.user %}
      <a href="{{ url_for('items.index') }}">Equipment</a>
      <span class="nav-user">{{ g.user.username }} ({{ g.user.department_name }})</span>
      <form method="post" action="{{ url_for('auth.logout') }}" class="nav-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <span class="nav-user"></span>
      <a href="{{ url_for('auth.login') }}">Log in</a>
      <a href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
  </nav>

  {% for message in get_flashed_messages() %}
    <p class="flash">{{ message }}</p>
  {% endfor %}

  <main>{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='unsaved_changes.js') }}"></script>
</body>
</html>
